<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meditation App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(to right, #89f7fe, #66a6ff);
    color: white;
}

h1 {
    margin-top: 50px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.start { background: green; color: white; }
.stop { background: red; color: white; }

#timer {
    font-size: 40px;
    margin: 20px;
}
</style>

</head>
<body>

<h1>🧘 Meditation Timer</h1>

<div id="timer">60</div>

<button class="start" onclick="startMeditation()">Start</button>
<button class="stop" onclick="stopMeditation()">Stop</button>

<script>
let time = 60;
let interval;

function startMeditation() {
    interval = setInterval(() => {
        if (time > 0) {
            time--;
            document.getElementById("timer").innerText = time;
        } else {
            clearInterval(interval);
            alert("Meditation Complete 🧘");
        }
    }, 1000);
}

function stopMeditation() {
    clearInterval(interval);
}
</script>

</body>
</html>
